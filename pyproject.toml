[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-act-companion"
version = "0.10.0"
description = "Local, rule-based EU AI Act risk classifier with an AI security lens (NIST AI RMF, OWASP LLM Top 10, MITRE ATLAS) and document generation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jesse van de Kasteele" }]
keywords = [
    "eu-ai-act", "ai-governance", "nist-ai-rmf", "responsible-ai",
    "ai-compliance", "ai-risk-assessment", "dpia", "ai-security",
    "owasp-llm", "mitre-atlas", "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.4",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",  # only used by the optional Ollama provider
]

[project.optional-dependencies]
# `dev` contains every dependency imported by the test suite. Keep optional
# runtime integrations separate for users, but make a documented dev install
# sufficient to run the complete test suite in a clean environment.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.8", "bandit>=1.7", "pip-audit>=2.7", "anthropic>=1"]
mcp = [
    "mcp>=1.28.1,<3",  # Claude Code / MCP server; supported 1.x and 2.x APIs
    "cryptography>=50.0.0",  # security floor for MCP's PyJWT crypto extra
    "pydantic-settings>=2.14.2",  # security floor for MCP configuration
]
capture = ["playwright>=1.40", "pillow>=12.3.0"]  # scripts/capture_demo.py (docs/img)
anthropic = ["anthropic>=1"]  # optional hosted Anthropic provider (app/llm/anthropic_provider.py)

[project.scripts]
ai-act = "app.cli:main"

[project.urls]
Homepage = "https://github.com/JKasteele/ai-act-companion"
Repository = "https://github.com/JKasteele/ai-act-companion"

[tool.setuptools]
packages = ["app", "app.knowledge", "app.llm"]
py-modules = ["mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length handled pragmatically

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
