name: Space keep-alive

# Free-tier Hugging Face Spaces go to sleep after ~48h without traffic, which
# breaks the public demo link. A daily health-endpoint ping keeps it awake.
# Note: GitHub disables scheduled workflows after 60 days of repo inactivity;
# re-enable from the Actions tab (or push a commit) if that happens.

on:
  schedule:
    - cron: "17 6 * * *" # daily; odd minute avoids the top-of-hour load spike
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the demo Space
        run: |
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 20 \
            https://jessekasteele-ai-act-companion.hf.space/api/health
