name: Release

# Build and publish to PyPI when a version tag is pushed (e.g. `v0.8.0`).
#
# Uses PyPI Trusted Publishing (OIDC) — no API token/secret to manage. Before
# the first release, configure the trusted publisher on PyPI:
#   PyPI → project "ai-act-companion" → Settings → Publishing → add a GitHub
#   publisher: owner=JKasteele, repo=ai-act-companion, workflow=release.yml,
#   environment=pypi. (For a brand-new project name, add a "pending publisher"
#   first.) Then create a GitHub Environment named `pypi`.
#
# After the first successful publish, action.yml can install from PyPI
# (`pip install ai-act-companion==<tag>`) instead of from git.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check metadata
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
