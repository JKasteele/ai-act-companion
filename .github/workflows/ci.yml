name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # Also run on Windows (the project is Windows-developed) on the newest
        # supported Python, without multiplying the whole matrix.
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev + mcp extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy, non-blocking)
        run: mypy app || true

      - name: Tests (pytest + coverage)
        run: pytest --cov=app --cov=mcp_server --cov-report=term-missing --cov-report=xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mcp]"
      - name: SAST (bandit)
        run: bandit -r app mcp_server.py -ll
      - name: Dependency audit (pip-audit, non-blocking)
        run: pip-audit || true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ai-act-companion:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --rm -e DEMO_MODE=1 -p 8000:8000 --name aiact ai-act-companion:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs aiact || true
          docker stop aiact || true
          test "${ok:-0}" = "1"
