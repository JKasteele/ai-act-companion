name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        # Also run on Windows (the project is Windows-developed) on the newest
        # supported Python, without multiplying the whole matrix.
        include:
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev + mcp extras)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,mcp]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Frontend syntax check
        run: |
          node --check static/app.js
          node --check static/workspace/workspace.js
          node --test tests/frontend/*.test.mjs

      - name: Build evidence workspace
        run: python scripts/build_workspace.py

      - name: Generated artifact drift
        if: runner.os == 'Linux' && matrix.python-version == '3.12'
        run: |
          python scripts/build_gallery.py
          python scripts/build_demo_assets.py
          git diff --exit-code -- docs/examples static/demo/mcp_transcript.json static/workspace/case.json static/workspace/assessment.json

      - name: Type check (mypy)
        run: mypy app mcp_server.py

      - name: Tests (pytest + coverage)
        run: pytest --cov=app --cov=mcp_server --cov-report=term-missing --cov-report=xml --cov-fail-under=90

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev,mcp]"
      - name: SAST (bandit)
        run: bandit -r app mcp_server.py -ll
      - name: Dependency audit (pip-audit)
        # Audit the resolved environment so the dev, MCP and hosted-LLM extras
        # installed above are covered as well as the core requirements.
        run: python -m pip_audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t ai-act-companion:ci .
      - name: Smoke-test the container
        run: |
          docker run -d --rm -e DEMO_MODE=1 -p 8000:8000 --name aiact ai-act-companion:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 1
          done
          docker logs aiact || true
          docker stop aiact || true
          test "${ok:-0}" = "1"
