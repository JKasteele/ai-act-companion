name: "EU AI Act relevance scan"
description: "Flag whether a repository appears to use AI/ML and may fall under the EU AI Act. A relevance check (deterministic, no model calls) — not a classification or legal advice."
author: "Jesse van de Kasteele"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Path within the repository to scan."
    required: false
    default: "."
  version:
    description: "AI Act Companion version to install from PyPI (default: latest release)."
    required: false
    default: ""
  ref:
    description: "Install from a git ref (tag/branch) instead of PyPI. Overrides `version`."
    required: false
    default: ""
  fail-on-detect:
    description: "Fail the step when AI/ML usage is detected (turn the scan into a gate)."
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    # Inputs reach the shell via env, never ${{ }} interpolation inside `run:`
    # — template expansion happens before the shell parses, so a crafted input
    # would otherwise become script.
    - name: Install AI Act Companion
      shell: bash
      env:
        AIACT_REF: ${{ inputs.ref }}
        AIACT_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$AIACT_REF" ]; then
          pip install "ai-act-companion @ git+https://github.com/JKasteele/ai-act-companion@$AIACT_REF"
        elif [ -n "$AIACT_VERSION" ]; then
          pip install "ai-act-companion==$AIACT_VERSION"
        else
          pip install ai-act-companion
        fi
    - name: Scan for EU AI Act relevance
      shell: bash
      env:
        AIACT_SCAN_PATH: ${{ inputs.path }}
        AIACT_FAIL_ON_DETECT: ${{ inputs.fail-on-detect }}
      run: |
        set -o pipefail
        FLAG=""
        if [ "$AIACT_FAIL_ON_DETECT" = "true" ]; then FLAG="--fail-on-detect"; fi
        ai-act scan "$AIACT_SCAN_PATH" $FLAG | tee -a "$GITHUB_STEP_SUMMARY"
